<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Tra cứu câu hỏi &amp; đáp án</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #171717;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --green: #087a4b;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;
    --mark: #fff2a8;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.045);
  }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border-bottom: 1px solid var(--border);
  }

  .wrap {
    width: min(100%, 932px);
    margin: 0 auto;
    padding: 16px;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  h1 {
    margin: 0;
    font-size: clamp(18px, 2.6vw, 23px);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .brand {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    user-select: none;
    white-space: nowrap;
  }

  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 17px;
    line-height: 1;
  }

  #search {
    width: 100%;
    min-height: 48px;
    padding: 11px 44px 11px 42px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    outline: none;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #search:focus {
    border-color: #9ca3af;
    box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.07);
  }

  #search::-webkit-search-cancel-button { display: none; }

  #clearSearch {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    display: none;
  }

  #clearSearch:hover,
  #clearSearch:focus-visible {
    background: #f3f4f6;
    color: var(--text);
  }

  #clearSearch.visible { display: block; }

  .meta-row {
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
  }

  .meta {
    font-size: 13px;
    color: var(--muted);
  }

  main.wrap { padding-top: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px;
    margin: 12px 0;
    box-shadow: var(--shadow);
  }

  .qid {
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
  }

  .question {
    font-size: 16px;
    font-weight: 600;
    margin: 5px 0 11px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .opt {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: #fafafa;
    overflow-wrap: anywhere;
  }

  .opt-label {
    margin-right: 6px;
    font-weight: 700;
  }

  .opt.correct {
    background: var(--green-bg);
    border-color: var(--green-border);
  }

  .answer {
    margin-top: 9px;
    font-size: 13px;
    color: var(--green);
    font-weight: 700;
  }

  mark {
    padding: 0 1px;
    border-radius: 2px;
    background: var(--mark);
    color: inherit;
  }

  .empty-state,
  .error-state {
    margin: 28px 0;
    padding: 28px 18px;
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: 14px;
    color: var(--muted);
  }

  .empty-state strong,
  .error-state strong {
    display: block;
    margin-bottom: 4px;
    color: var(--text);
    font-size: 16px;
  }

  #backToTop {
    position: fixed;
    right: max(18px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 42px;
    height: 42px;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.96);
    color: var(--text);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: 0.18s ease;
  }

  #backToTop.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  @media (min-width: 700px) {
    .options { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 560px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    .header-top { gap: 8px; }
    .brand { font-size: 11px; }
    #search { font-size: 15px; }
    .card { padding: 13px; border-radius: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="header-top">
      <h1>TRA CỨU CÂU HỎI – ĐÁP ÁN</h1>
      <div class="brand" aria-label="Thông tin phát triển">Powered by Thiên Long</div>
    </div>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="search"
        type="search"
        autocomplete="off"
        spellcheck="false"
        aria-label="Tìm câu hỏi hoặc đáp án"
        placeholder="Nhập từ khóa để tìm câu hỏi hoặc đáp án..."
      >
      <button id="clearSearch" type="button" aria-label="Xóa từ khóa tìm kiếm" title="Xóa tìm kiếm">×</button>
    </div>

    <div class="meta-row">
      <span class="meta" id="meta" aria-live="polite"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="results"></div>
</main>

<button id="backToTop" type="button" aria-label="Lên đầu trang" title="Lên đầu trang">↑</button>

<!-- File dữ liệu đặt cùng thư mục với index.html -->
<script src="qna_data.js"></script>
<script>
'use strict';

// qna_data.js cần khai báo: var qaList = [...] hoặc window.qaList = [...]
const data = (typeof qaList !== 'undefined' && Array.isArray(qaList))
  ? qaList
  : (Array.isArray(window.qaList) ? window.qaList : []);

const elSearch = document.getElementById('search');
const elClearSearch = document.getElementById('clearSearch');
const elResults = document.getElementById('results');
const elMeta = document.getElementById('meta');
const elBackToTop = document.getElementById('backToTop');

let searchTimer = null;

function normalizeVN(value) {
  return String(value ?? '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .trim();
}

function buildNormalizedMap(text) {
  const chars = Array.from(String(text ?? ''));
  let normalized = '';
  const map = [];

  chars.forEach((char, originalIndex) => {
    const clean = char
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd');

    for (const normalizedChar of clean) {
      normalized += normalizedChar;
      map.push(originalIndex);
    }
  });

  return { chars, normalized, map };
}

function appendHighlightedText(parent, text, rawQuery) {
  const source = String(text ?? '');
  const query = normalizeVN(rawQuery);

  if (!query) {
    parent.textContent = source;
    return;
  }

  const { chars, normalized, map } = buildNormalizedMap(source);
  let searchFrom = 0;
  let originalFrom = 0;
  let foundAny = false;

  while (searchFrom < normalized.length) {
    const foundAt = normalized.indexOf(query, searchFrom);
    if (foundAt === -1) break;

    const startOriginal = map[foundAt];
    const endMapIndex = foundAt + query.length - 1;
    const endOriginal = map[endMapIndex];

    if (startOriginal === undefined || endOriginal === undefined) break;

    if (startOriginal > originalFrom) {
      parent.appendChild(document.createTextNode(chars.slice(originalFrom, startOriginal).join('')));
    }

    const mark = document.createElement('mark');
    mark.textContent = chars.slice(startOriginal, endOriginal + 1).join('');
    parent.appendChild(mark);
    foundAny = true;

    originalFrom = endOriginal + 1;
    searchFrom = foundAt + query.length;
  }

  if (!foundAny) {
    parent.textContent = source;
    return;
  }

  if (originalFrom < chars.length) {
    parent.appendChild(document.createTextNode(chars.slice(originalFrom).join('')));
  }
}

function getSearchableText(item) {
  return [
    item?.id,
    item?.q,
    ...Object.entries(item?.options || {}).flatMap(([key, value]) => [key, value]),
    item?.correct
  ].join(' ');
}

function isCorrectOption(correctValue, optionKey) {
  const correct = String(correctValue ?? '').toUpperCase();
  const key = String(optionKey ?? '').toUpperCase();
  return key !== '' && correct.includes(key);
}

function createOption(optionKey, optionValue, correctValue, rawQuery) {
  const opt = document.createElement('div');
  opt.className = 'opt';

  if (isCorrectOption(correctValue, optionKey)) {
    opt.classList.add('correct');
  }

  const label = document.createElement('span');
  label.className = 'opt-label';
  label.textContent = `${optionKey})`;

  const text = document.createElement('span');
  appendHighlightedText(text, optionValue, rawQuery);

  opt.append(label, text);
  return opt;
}

function showDataError() {
  elMeta.textContent = 'Không có dữ liệu';
  elResults.replaceChildren();

  const box = document.createElement('div');
  box.className = 'error-state';

  const title = document.createElement('strong');
  title.textContent = 'Chưa tải được dữ liệu câu hỏi';

  const desc = document.createElement('div');
  desc.textContent = 'Hãy kiểm tra file qna_data.js có nằm cùng thư mục với index.html và khai báo đúng biến qaList.';

  box.append(title, desc);
  elResults.appendChild(box);
}

function render(items, rawQuery = '') {
  elResults.replaceChildren();

  const query = rawQuery.trim();
  elMeta.textContent = query
    ? `Tìm thấy ${items.length} / ${data.length} câu`
    : `Có ${data.length} câu hỏi`;

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';

    const title = document.createElement('strong');
    title.textContent = 'Không tìm thấy câu hỏi phù hợp';

    const desc = document.createElement('div');
    desc.textContent = query ? `Từ khóa: “${query}”` : 'Danh sách hiện chưa có dữ liệu.';

    empty.append(title, desc);
    elResults.appendChild(empty);
    return;
  }

  const frag = document.createDocumentFragment();

  items.forEach((item, index) => {
    const card = document.createElement('article');
    card.className = 'card';

    const qid = document.createElement('div');
    qid.className = 'qid';
    qid.textContent = `Câu ${item?.id ?? index + 1}`;

    const question = document.createElement('div');
    question.className = 'question';
    appendHighlightedText(question, item?.q ?? '', rawQuery);

    const options = document.createElement('div');
    options.className = 'options';

    Object.entries(item?.options || {}).forEach(([key, value]) => {
      options.appendChild(createOption(key, value, item?.correct, rawQuery));
    });

    const answer = document.createElement('div');
    answer.className = 'answer';
    answer.textContent = item?.correct
      ? `Đáp án: ${item.correct}`
      : 'Đáp án: (chưa xác định)';

    card.append(qid, question, options, answer);
    frag.appendChild(card);
  });

  elResults.appendChild(frag);
}

function runSearch() {
  const rawQuery = elSearch.value;
  const query = normalizeVN(rawQuery);

  elClearSearch.classList.toggle('visible', rawQuery.length > 0);

  if (!query) {
    render(data, '');
    return;
  }

  const filtered = data.filter(item => normalizeVN(getSearchableText(item)).includes(query));
  render(filtered, rawQuery);
}

function scheduleSearch() {
  window.clearTimeout(searchTimer);
  searchTimer = window.setTimeout(runSearch, 100);
}

elSearch.addEventListener('input', scheduleSearch);

elSearch.addEventListener('keydown', event => {
  if (event.key === 'Escape' && elSearch.value) {
    elSearch.value = '';
    runSearch();
  }
});

elClearSearch.addEventListener('click', () => {
  elSearch.value = '';
  runSearch();
  elSearch.focus();
});

window.addEventListener('scroll', () => {
  elBackToTop.classList.toggle('visible', window.scrollY > 500);
}, { passive: true });

elBackToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

if (!Array.isArray(data) || data.length === 0) {
  showDataError();
} else {
  render(data);
}
</script>
</body>
</html>
